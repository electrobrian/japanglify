name: Build test APKs

on:
  workflow_dispatch:
  pull_request:
    branches: [BETA-2, BETA-3]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'domain/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/test-apks.yml'

# Raw APK downloads are published as GitHub prerelease assets. Actions
# artifacts are intentionally not used because GitHub always wraps them in ZIP.
permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # BETA-2 is an integration branch rather than the repository default
          # branch. Let successful tester-ready PRs refresh reusable Gradle
          # dependencies, transforms, compiled scripts, and local build-cache
          # entries for the next PR.
          cache-read-only: false
      - name: Create ephemeral tester signing key
        run: |
          mkdir -p app/build
          keytool -genkeypair -keystore app/build/local-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > keystore.properties <<'EOF'
          storeFile=app/build/local-debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
      - name: Build tester APKs
        run: ./gradlew --build-cache :app:assembleDownloadableDebug :app:assembleBundledDebug :app:assembleDownloadableRelease
      - name: Prepare raw APK assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/downloadable/debug/*.apk dist/japanglify-downloadable-debug.apk
          cp app/build/outputs/apk/bundled/debug/*.apk dist/japanglify-bundled-debug.apk
          cp app/build/outputs/apk/downloadable/release/*.apk dist/japanglify-downloadable-release.apk
      - name: Publish individual tester APKs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            tag="pr-${PR_NUMBER}-build-${RUN_NUMBER}"
            title="PR #${PR_NUMBER} tester APKs (build ${RUN_NUMBER})"
            target="$HEAD_SHA"
            source="PR #${PR_NUMBER}"
          else
            tag="manual-build-${RUN_NUMBER}"
            title="Manual tester APKs (build ${RUN_NUMBER})"
            target="$GITHUB_SHA"
            source="manual workflow dispatch"
          fi

          notes="Tester binaries for ${source}.

          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}
          Commit: ${target}

          The downloadable release APK is minified but uses an ephemeral CI signing key. Treat all three APKs as fresh-install tester builds, not production releases."

          gh release create "$tag" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "$title" \
            --notes "$notes" \
            --prerelease
