name: Build test APKs

on:
  push:
    branches: [BETA-2, BETA-3, 'agent/**']
    paths-ignore:
      - '**/*.md'
      - 'AGENTS.md'
      - 'DEVELOPMENT.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [BETA-2, BETA-3]
    paths-ignore:
      - '**/*.md'
      - 'AGENTS.md'
      - 'DEVELOPMENT.md'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both test APKs
        run: ./gradlew :app:assembleDownloadableDebug :app:assembleBundledDebug
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: japanglify-test-apks-${{ github.run_number }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/downloadable/debug/*.apk
            app/build/outputs/apk/bundled/debug/*.apk
